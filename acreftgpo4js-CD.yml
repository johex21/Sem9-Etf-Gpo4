trigger: none

resources:
  pipelines:
  - pipeline: ci-build
    source: 'acreftgpo4js-CI'
    trigger: true

variables:
  - group: vg-eft-mysql
  - name: acrServer
    value: 'acreftgpo4js.azurecr.io'
  - name: imageRepository
    value: 'boardgames-app'

stages:
# ==============================================================================
# ETAPA 1: VALIDACIÓN EN AMBIENTE DE DESARROLLO (DEV)
# ==============================================================================
- stage: Deploy_DEV
  displayName: 'Despliegue a Desarrollo (DEV)'
  jobs:
  - deployment: DeployAppDev
    displayName: 'Despliegue y Validacion en Entorno DEV'
    pool:
      vmImage: 'ubuntu-latest'
    environment:
      name: 'Entorno-Desarrollo'
    strategy:
      runOnce:
        deploy:
          steps:
          - script: |
              echo "==> Iniciando validación en Entorno-Desarrollo..."
              IMAGE_TAG="$(resources.pipeline.ci-build.runID)"
              if [ -z "$IMAGE_TAG" ]; then
                IMAGE_TAG="latest"
              fi
              echo "==> Artefacto CI a validar: $(acrServer)/$(imageRepository):$IMAGE_TAG"
              echo "==> Base de datos configurada: $(MYSQL_DATABASE)"
              echo "==> Validaciones en DEV: OK"
            displayName: 'Pruebas de Validacion DEV'

# ==============================================================================
# ETAPA 2: PRODUCCIÓN (PROD) CON MANUAL APPROVAL GATE Y DOCKER COMPOSE
# ==============================================================================
- stage: Deploy_PROD
  displayName: 'Desplegar en Produccion'
  dependsOn: Deploy_DEV
  condition: succeeded()
  jobs:
  - deployment: DeployAppProd
    displayName: 'Despliegue Spring Boot y MySQL a Producción VM'
    environment:
      name: 'Entorno-Produccion'
      resourceType: VirtualMachine
      resourceName: 'vm-eftgpo4js'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - script: |
              echo "==> Aprobación manual confirmada. Iniciando orquestación con Docker Compose..."
              echo "==> Autenticando con Managed Identity en ACR..."
              az login --identity
              az acr login --name acreftgpo4js

              IMAGE_TAG="$(resources.pipeline.ci-build.runID)"
              if [ -z "$IMAGE_TAG" ]; then
                IMAGE_TAG="latest"
              fi

              echo "==> Exportando variables de entorno requeridas por docker-compose.yml..."
              export ACR_SERVER="$(acrServer)"
              export IMAGE_REPOSITORY="$(imageRepository)"
              export IMAGE_TAG="$IMAGE_TAG"
              export MYSQL_DATABASE="$(MYSQL_DATABASE)"
              export MYSQL_ROOT_PASSWORD="$(MYSQL_ROOT_PASSWORD)"

              echo "==> Descargando imagen inmutable validada en CI..."
              docker pull $(acrServer)/$(imageRepository):$IMAGE_TAG

              echo "==> Levantando stack orquestado (Spring Boot + MySQL)..."
              docker compose down --remove-orphans || true
              docker compose up -d

              echo "==> Orquestación completada exitosamente."
            displayName: 'Orquestación de Contenedores con Docker Compose'