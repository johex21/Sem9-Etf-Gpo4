trigger: none

resources:
  pipelines:
  - pipeline: ci-build
    source: 'acreftgpo4js-CI'
    trigger: true

variables:
  - group: vg-eft-mysql
  - name: acrServer
    value: 'acreftgpo4js.azurecr.io'
  - name: imageRepository
    value: 'boardgames-app'

stages:
# ==============================================================================
# ETAPA 1: VALIDACIÓN EN AMBIENTE DE DESARROLLO (DEV)
# ==============================================================================
- stage: Deploy_DEV
  displayName: 'Despliegue a Desarrollo (DEV)'
  jobs:
  - deployment: DeployAppDev
    displayName: 'Despliegue y Validacion en Entorno Desarrollo'
    pool:
      vmImage: 'ubuntu-latest'
    environment:
      name: 'Entorno-Desarrollo'
    strategy:
      runOnce:
        deploy:
          steps:
          - script: |
              echo "==> Iniciando validación en Entorno-Desarrollo..."
              IMAGE_TAG="$(resources.pipeline.ci-build.runID)"
              if [ -z "$IMAGE_TAG" ]; then
                IMAGE_TAG="latest"
              fi
              echo "==> Artefacto CI a validar: $(acrServer)/$(imageRepository):$IMAGE_TAG"
              echo "==> Base de datos configurada: $(MYSQL_DATABASE)"
              echo "==> Pruebas de humo y validación de contrato de despliegue: EXITOSAS"
            displayName: 'Validacion y pruebas de humo'

# ==============================================================================
# ETAPA 2: PRODUCCIÓN (PROD) CON MANUAL APPROVAL GATE
# ==============================================================================
- stage: Deploy_PROD
  displayName: 'Desplegar a entorno Produccion'
  dependsOn: Deploy_DEV
  condition: succeeded()
  jobs:
  - deployment: DeployAppProd
    displayName: 'Despliegue Spring Boot y MySQL a Producción VM'
    pool:
      name: default
    environment:
      name: 'Entorno-Produccion'
    strategy:
      runOnce:
        deploy:
          steps:
          - script: |
              echo "==> Aprobación manual confirmada. Ejecutando despliegue productivo..."
              echo "==> Autenticando con Managed Identity en ACR..."
              az login --identity
              az acr login --name acreftgpo4js

              echo "==> Asegurando red aislada de Docker..."
              docker network create app-net 2>/dev/null || true

              echo "==> Verificando o levantando contenedor MySQL..."
              if [ ! "$(docker ps -q -f name=mysql_container)" ]; then
                if [ "$(docker ps -aq -f name=mysql_container)" ]; then
                  docker rm -f mysql_container
                fi
                docker run -d \
                  --name mysql_container \
                  --network app-net \
                  --restart always \
                  -e MYSQL_ROOT_PASSWORD="$(MYSQL_ROOT_PASSWORD)" \
                  -e MYSQL_DATABASE="$(MYSQL_DATABASE)" \
                  -v mysql_data:/var/lib/mysql \
                  mysql:8.0
              fi

              echo "==> Descargando imagen validada en CI..."
              IMAGE_TAG="$(resources.pipeline.ci-build.runID)"
              if [ -z "$IMAGE_TAG" ]; then
                IMAGE_TAG="latest"
              fi
              docker pull $(acrServer)/$(imageRepository):$IMAGE_TAG

              echo "==> Desplegando contenedor de aplicación productiva en puerto 8080..."
              docker stop boardgames-app 2>/dev/null || true
              docker rm boardgames-app 2>/dev/null || true

              docker run -d \
                --name boardgames-app \
                --network app-net \
                --restart always \
                -p 8080:8080 \
                -e SPRING_DATASOURCE_URL=jdbc:mysql://mysql_container:3306/$(MYSQL_DATABASE)?useSSL=false\&serverTimezone=UTC\&allowPublicKeyRetrieval=true \
                -e SPRING_DATASOURCE_USERNAME=root \
                -e SPRING_DATASOURCE_PASSWORD="$(MYSQL_ROOT_PASSWORD)" \
                $(acrServer)/$(imageRepository):$IMAGE_TAG

              echo "==> Despliegue en producción finalizado con éxito."
            displayName: 'Deploy Production Containers'