trigger:
  branches:
    include:
      - main

variables:
  - name: dockerRegistryServiceConnection
    value: 'sc-acr-eft'
  - name: imageRepository
    value: 'boardgames-app'
  - name: dockerfilePath
    value: '$(Build.SourcesDirectory)/Dockerfile'
  - name: tag
    value: '$(Build.BuildId)'

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: BuildAndPush
  displayName: 'Construir y Pushar imagen de Docker'
  jobs:
  - job: Build
    displayName: 'Construir y Pushar a ACR'
    steps:
    - task: Docker@2
      displayName: 'Login to ACR'
      inputs:
        command: login
        containerRegistry: $(dockerRegistryServiceConnection)

    - task: Docker@2
      displayName: 'Construir y Pushar imagen a container registry'
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
          latest