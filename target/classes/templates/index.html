<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reinos de Cartón | Catálogo DevOps</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; transition: transform 0.2s; }
        .card:hover { transform: translateY(-4px); border-color: #38bdf8; }
        .card-img-top { height: 180px; object-fit: cover; border-top-left-radius: 11px; border-top-right-radius: 11px; }
        .navbar { background-color: #1e293b !important; border-bottom: 1px solid #334155; }
        .badge-players { background-color: #0369a1; }
        .modal-content { background-color: #1e293b; color: #f8fafc; border: 1px solid #475569; }
        .form-control, .form-select { background-color: #0f172a; border-color: #475569; color: #f8fafc; }
        .form-control:focus, .form-select:focus { background-color: #0f172a; color: #f8fafc; border-color: #38bdf8; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold text-info" href="/">
            <i class="bi bi-dice-5-fill me-2"></i>Reinos de Cartón
        </a>
        <div class="d-flex align-items-center gap-3">
            <span class="badge bg-secondary d-none d-md-inline"><i class="bi bi-cloud-check-fill me-1"></i>Azure DevOps VM</span>
            <button class="btn btn-primary btn-sm rounded-pill px-3" data-bs-toggle="modal" data-bs-target="#newGameModal">
                <i class="bi bi-plus-lg me-1"></i>Nuevo Juego
            </button>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <div class="row align-items-center mb-4">
        <div class="col">
            <h2 class="h4 fw-bold mb-1">Catálogo de Juegos de Mesa</h2>
            <p class="text-secondary small mb-0">Microservicio Spring Boot conectado a contenedor MySQL en Microsoft Azure</p>
        </div>
    </div>

    <!-- Grid de Juegos -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="game : ${games}">
            <div class="card h-100 shadow-sm text-light">
                <img th:src="${game.imageUrl}" class="card-img-top" alt="Portada de juego">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <span class="badge bg-primary text-uppercase" th:text="${game.category}">Estrategia</span>
                        <span class="badge badge-players"><i class="bi bi-people-fill me-1"></i><span th:text="${game.minPlayers} + '-' + ${game.maxPlayers}"></span></span>
                    </div>
                    <h5 class="card-title fw-bold" th:text="${game.name}">Nombre del Juego</h5>
                    <div class="mt-auto pt-3 d-flex justify-content-between align-items-center border-top border-secondary">
                        <span class="fs-5 fw-bold text-info">$<span th:text="${#numbers.formatDecimal(game.price, 0, 'POINT', 0, 'POINT')}"></span></span>
                        <a th:href="@{/games/delete/{id}(id=${game.id})}" class="btn btn-outline-danger btn-sm" onclick="return confirm('¿Seguro que deseas eliminar este juego?')">
                            <i class="bi bi-trash"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal para agregar juego -->
<div class="modal fade" id="newGameModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/games/add}" th:object="${newGame}" method="post">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title"><i class="bi bi-plus-circle me-2"></i>Registrar Nuevo Juego</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label small">Nombre del Juego</label>
                        <input type="text" class="form-control" th:field="*{name}" required placeholder="Ej: Terraforming Mars">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Categoría</label>
                        <input type="text" class="form-control" th:field="*{category}" required placeholder="Ej: Estrategia, Familiar, Cartas">
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col">
                            <label class="form-label small">Mín. Jugadores</label>
                            <input type="number" class="form-control" th:field="*{minPlayers}" min="1" required value="2">
                        </div>
                        <div class="col">
                            <label class="form-label small">Máx. Jugadores</label>
                            <input type="number" class="form-control" th:field="*{maxPlayers}" min="1" required value="5">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Precio (CLP)</label>
                        <input type="number" step="100" class="form-control" th:field="*{price}" required placeholder="39990">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">URL de Imagen (Opcional)</label>
                        <input type="url" class="form-control" th:field="*{imageUrl}" placeholder="https://ejemplo.com/imagen.jpg">
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-info btn-sm text-dark fw-bold">Guardar en Base de Datos</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
